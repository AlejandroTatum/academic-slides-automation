<!-- component: flow-steps | deck, every theme
     A process as numbered steps with arrows. Default 3; up to 5 fit the canvas.
     Each label is 1-2 words. The transitions are spoken, in .notes. -->
<style>
  :where(.flow-steps) { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 96px; }
  :where(.flow-steps li) { position: relative; display: flex; flex-direction: column; align-items: center; gap: 28px; font-size: 46px; font-weight: 600; text-align: center; }
  :where(.flow-steps .dot) { width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center; background: var(--a1);
    color: var(--dot-fg, var(--bg)); font-family: var(--display); font-weight: var(--dw); font-size: 80px; }
  :where(.flow-steps li:nth-child(3n+2) .dot) { background: var(--a2); }
  :where(.flow-steps li:nth-child(3n) .dot) { background: var(--a3); }
  :where(.flow-steps li:not(:last-child))::after { content: "→"; position: absolute; right: -48px; top: 38px; transform: translateX(50%);
    font-size: 80px; line-height: 1; color: var(--muted); }
</style>
<section class="slide" id="ciclo">
  <p class="kicker">03 · Proceso</p>
  <h1 class="title sm">Ciclo de un proceso</h1>
  <ol class="flow-steps">
    <li><span class="dot">1</span>Nuevo</li>
    <li><span class="dot">2</span>Listo</li>
    <li><span class="dot">3</span>Ejecución</li>
  </ol>
  <aside class="notes">Se crea, espera CPU en la cola de listos y el planificador lo despacha.</aside>
</section>
