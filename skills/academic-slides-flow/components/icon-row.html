<!-- component: icon-row | deck, every theme | needs icon-sprite
     Icons with 1-3 word labels. Default 3; add <li> when the slide needs more (see writing.md).
     Accent order is a1, a2, a3 and repeats; each position is a category the reader can name. -->
<style>
  :where(.icon-row) { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 64px; }
  :where(.icon-row li) { display: flex; flex-direction: column; align-items: center; gap: 32px; font-size: 46px; font-weight: 600; text-align: center; }
  :where(.icon-row .icon) { width: 200px; height: 200px; fill: none; stroke: currentColor; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; color: var(--a1); }
  :where(.icon-row li:nth-child(3n+2) .icon) { color: var(--a2); }
  :where(.icon-row li:nth-child(3n) .icon) { color: var(--a3); }
</style>
<section class="slide" id="idea">
  <p class="kicker">01 · Idea</p>
  <h1 class="title sm">¿Qué decide el planificador?</h1>
  <ul class="icon-row">
    <li><svg class="icon"><use href="#i-enter"/></svg>Quién entra</li>
    <li><svg class="icon"><use href="#i-clock"/></svg>Cuánto dura</li>
    <li><svg class="icon"><use href="#i-queue"/></svg>Quién espera</li>
  </ul>
  <aside class="notes">El planificador elige el próximo proceso, cuánto tiempo corre y quién queda en la cola.</aside>
</section>
