<!DOCTYPE html>
<html lang="es" data-mode="deck">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck</title>
<!-- Two links: the shared deck base, then one deck theme:
     deportivo, metro-deck, pizarra, editorial, terminal, bauhaus, cuaderno, pop, retro.
     From this folder the links are ../themes/...; copied to a destination root, use themes/...
     The animation layer (assets/anim/) always goes last; ?print renders the PDF without it. -->
<link rel="stylesheet" href="../themes/deck-base.css">
<link rel="stylesheet" href="../themes/deportivo.css">
<link rel="stylesheet" href="../assets/anim/anim.css">
</head>
<body>
<div id="stage">
  <section class="slide dark active">
    <p class="kicker">Materia · Semana</p>
    <h1 class="title xl">Título<br><span class="a">acento</span></h1>
    <aside class="notes">Notas del orador. N las muestra.</aside>
    <div class="foot"><span>MATERIA</span><span class="page">01</span><i class="bar"></i></div>
  </section>
  <div id="notes"></div>
</div>
<script>
"use strict";
const PRINT = new URLSearchParams(location.search).has("print");
const slides = [...document.querySelectorAll(".slide")];
let current = 0;
function show(i) {
  current = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((slide, index) => slide.classList.toggle("active", index === current));
  const notes = slides[current].querySelector(".notes");
  document.getElementById("notes").textContent = notes ? notes.textContent : "";
  history.replaceState(null, "", "#" + (current + 1));
}
function resize() {
  const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById("stage").style.transform = "translate(-50%, -50%) scale(" + scale + ")";
}
document.addEventListener("keydown", (event) => {
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(event.key)) { event.preventDefault(); show(current + 1); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(event.key)) { event.preventDefault(); show(current - 1); }
  else if (event.key === "Home") show(0);
  else if (event.key === "End") show(slides.length - 1);
  else if (event.key === "f" || event.key === "F") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  else if (event.key === "n" || event.key === "N") document.body.classList.toggle("show-notes");
});
if (PRINT) document.body.classList.add("print");
else { addEventListener("resize", resize); resize(); show(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1)); }
</script>
<script src="../assets/anim/anim.js"></script>
</body>
</html>
